<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="1600" height="900" fill="#FFFFFF"/><text x="40" y="48" font-size="28" font-weight="bold" fill="#111827" text-anchor="start"><tspan x="40" dy="0">First-time investors&#x27; SIPs mostly end at the stop decision, not at a failed payment</tspan></text><rect x="500" y="70" width="600" height="92" rx="10" fill="#00B386"/><text x="800.0" y="106" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="800.0" dy="0">Active SIP at month 12 — first-time investors</tspan></text><text x="800.0" y="136" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="800.0" dy="0">% with ≥ 1 successful instalment in the last 30 days</tspan></text><text x="800.0" y="192" font-size="15" font-weight="normal" fill="#6B7280" text-anchor="middle"><tspan x="800.0" dy="0">= Activated × (1 − involuntary lapse) × (1 − pause becomes stop) × (1 − deliberate stop) + recovered within 30 days</tspan></text><line x1="800.0" y1="206" x2="184.0" y2="232" stroke="#D1D5DB" stroke-width="1.5"/><rect x="40.0" y="300" width="288.0" height="430" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><rect x="40.0" y="300" width="288.0" height="44" rx="10" fill="#6B7280"/><rect x="40.0" y="330" width="288.0" height="14" fill="#6B7280"/><text x="54.0" y="329" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="54.0" dy="0">Activation</tspan></text><text x="54.0" y="372" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="54.0" dy="0">PRODUCT OUTCOME</tspan></text><text x="54.0" y="392" font-size="14" font-weight="bold" fill="#111827" text-anchor="start"><tspan x="54.0" dy="0">The first SIP is set up and</tspan><tspan x="54.0" dy="18.2">the first instalment succeeds</tspan></text><text x="54.0" y="444" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="54.0" dy="0">USER BEHAVIOURS</tspan></text><text x="54.0" y="464" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="54.0" dy="0">• Completes the autopay mandate</tspan></text><text x="54.0" y="485" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="54.0" dy="0">• Has balance on the first debit</tspan><tspan x="54.0" dy="16.900000000000002">  date</tspan></text><text x="54.0" y="523" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="54.0" dy="0">• Knows when the first debit is</tspan></text><text x="54.0" y="554" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="54.0" dy="0">LEADING INDICATOR</tspan></text><text x="54.0" y="573" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="54.0" dy="0">% of first SIPs whose first</tspan><tspan x="54.0" dy="16.900000000000002">instalment succeeds</tspan></text><line x1="54.0" y1="652" x2="314.0" y2="652" stroke="#E5E7EB"/><text x="54.0" y="668" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start"><tspan x="54.0" dy="0">Before the stop corpus —</tspan><tspan x="54.0" dy="16.900000000000002">measure with Groww data</tspan></text><line x1="800.0" y1="206" x2="492.0" y2="232" stroke="#D1D5DB" stroke-width="1.5"/><rect x="348.0" y="300" width="288.0" height="430" rx="10" fill="#FFFFFF" stroke="#E69F00" stroke-width="3" stroke-dasharray="10 6"/><rect x="348.0" y="300" width="288.0" height="44" rx="10" fill="#E69F00"/><rect x="348.0" y="330" width="288.0" height="14" fill="#E69F00"/><text x="362.0" y="329" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="362.0" dy="0">A · Involuntary lapse</tspan></text><text x="362.0" y="372" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="362.0" dy="0">PRODUCT OUTCOME</tspan></text><text x="362.0" y="392" font-size="14" font-weight="bold" fill="#111827" text-anchor="start"><tspan x="362.0" dy="0">Every instalment goes through,</tspan><tspan x="362.0" dy="18.2">and a failure is recovered</tspan><tspan x="362.0" dy="18.2">inside 30 days</tspan></text><text x="362.0" y="462" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="362.0" dy="0">USER BEHAVIOURS</tspan></text><text x="362.0" y="482" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="362.0" dy="0">• Keeps balance on the debit date</tspan></text><text x="362.0" y="503" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="362.0" dy="0">• Updates the mandate after a</tspan><tspan x="362.0" dy="16.900000000000002">  bank / salary-account change</tspan></text><text x="362.0" y="541" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="362.0" dy="0">• Notices a failed debit</tspan></text><text x="362.0" y="572" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="362.0" dy="0">LEADING INDICATOR</tspan></text><text x="362.0" y="591" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="362.0" dy="0">Failed-instalment recovery</tspan><tspan x="362.0" dy="16.900000000000002">within 7 days</tspan></text><line x1="362.0" y1="652" x2="622.0" y2="652" stroke="#E5E7EB"/><text x="362.0" y="668" font-size="13" font-weight="bold" fill="#111827" text-anchor="start"><tspan x="362.0" dy="0">Stop posts: 39% all · 8% first-time</tspan></text><text x="362.0" y="688" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="362.0" dy="0">Est. uplift: +5.8 pp all · +1.5 pp first-time</tspan></text><line x1="800.0" y1="206" x2="800.0" y2="232" stroke="#D1D5DB" stroke-width="1.5"/><rect x="656.0" y="300" width="288.0" height="430" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><rect x="656.0" y="300" width="288.0" height="44" rx="10" fill="#0072B2"/><rect x="656.0" y="330" width="288.0" height="14" fill="#0072B2"/><text x="670.0" y="329" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="670.0" dy="0">B · Pause becomes stop</tspan></text><text x="670.0" y="372" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="670.0" dy="0">PRODUCT OUTCOME</tspan></text><text x="670.0" y="392" font-size="14" font-weight="bold" fill="#111827" text-anchor="start"><tspan x="670.0" dy="0">A pause or cash squeeze ends</tspan><tspan x="670.0" dy="18.2">in a resume, a skip or a</tspan><tspan x="670.0" dy="18.2">smaller amount, not a cancel</tspan></text><text x="670.0" y="462" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="670.0" dy="0">USER BEHAVIOURS</tspan></text><text x="670.0" y="482" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="670.0" dy="0">• Pauses for a cash need and</tspan><tspan x="670.0" dy="16.900000000000002">  forgets to resume</tspan></text><text x="670.0" y="520" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="670.0" dy="0">• Cancels instead of reducing</tspan></text><text x="670.0" y="541" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="670.0" dy="0">• Can&#x27;t tell pause from stop</tspan></text><text x="670.0" y="572" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="670.0" dy="0">LEADING INDICATOR</tspan></text><text x="670.0" y="591" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="670.0" dy="0">Paused SIPs resumed on time;</tspan><tspan x="670.0" dy="16.900000000000002">cancel intents that pick skip /</tspan><tspan x="670.0" dy="16.900000000000002">reduce</tspan></text><line x1="670.0" y1="652" x2="930.0" y2="652" stroke="#E5E7EB"/><text x="670.0" y="668" font-size="13" font-weight="bold" fill="#111827" text-anchor="start"><tspan x="670.0" dy="0">Stop posts: 11% all · 21% first-time</tspan></text><text x="670.0" y="688" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="670.0" dy="0">Est. uplift: +1.0 pp all · +2.1 pp first-time</tspan></text><line x1="800.0" y1="206" x2="1108.0" y2="232" stroke="#D1D5DB" stroke-width="1.5"/><rect x="964.0" y="300" width="288.0" height="430" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="4"/><rect x="964.0" y="300" width="288.0" height="44" rx="10" fill="#0072B2"/><rect x="964.0" y="330" width="288.0" height="14" fill="#0072B2"/><text x="978.0" y="329" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="978.0" dy="0">C · Deliberate stop</tspan></text><text x="978.0" y="372" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="978.0" dy="0">PRODUCT OUTCOME</tspan></text><text x="978.0" y="392" font-size="14" font-weight="bold" fill="#111827" text-anchor="start"><tspan x="978.0" dy="0">At the &#x27;should I stop?&#x27; moment</tspan><tspan x="978.0" dy="18.2">the investor continues,</tspan><tspan x="978.0" dy="18.2">adjusts, or restarts without a</tspan><tspan x="978.0" dy="18.2">gap</tspan></text><text x="978.0" y="480" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="978.0" dy="0">USER BEHAVIOURS</tspan></text><text x="978.0" y="500" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="978.0" dy="0">• Doubts after weak returns or a</tspan><tspan x="978.0" dy="16.900000000000002">  fall</tspan></text><text x="978.0" y="538" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="978.0" dy="0">• Asks strangers whether to stop</tspan></text><text x="978.0" y="559" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="978.0" dy="0">• Stops one SIP to start another</tspan></text><text x="978.0" y="590" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="978.0" dy="0">LEADING INDICATOR</tspan></text><text x="978.0" y="609" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="978.0" dy="0">Stop intents that end in</tspan><tspan x="978.0" dy="16.900000000000002">continue / adjust; restart</tspan><tspan x="978.0" dy="16.900000000000002">within 30 days of a switch</tspan></text><line x1="978.0" y1="652" x2="1238.0" y2="652" stroke="#E5E7EB"/><text x="978.0" y="668" font-size="13" font-weight="bold" fill="#111827" text-anchor="start"><tspan x="978.0" dy="0">Stop posts: 34% all · 50% first-time</tspan></text><text x="978.0" y="688" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="978.0" dy="0">Est. uplift: +2.3 pp all · +4.0 pp first-time</tspan></text><line x1="800.0" y1="206" x2="1416.0" y2="232" stroke="#D1D5DB" stroke-width="1.5"/><rect x="1272.0" y="300" width="288.0" height="430" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><rect x="1272.0" y="300" width="288.0" height="44" rx="10" fill="#6B7280"/><rect x="1272.0" y="330" width="288.0" height="14" fill="#6B7280"/><text x="1286.0" y="329" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="1286.0" dy="0">D · Confusion drift</tspan></text><text x="1286.0" y="372" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="1286.0" dy="0">PRODUCT OUTCOME</tspan></text><text x="1286.0" y="392" font-size="14" font-weight="bold" fill="#111827" text-anchor="start"><tspan x="1286.0" dy="0">The investor can tell whether</tspan><tspan x="1286.0" dy="18.2">the SIP is on track without</tspan><tspan x="1286.0" dy="18.2">outside help</tspan></text><text x="1286.0" y="462" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="1286.0" dy="0">USER BEHAVIOURS</tspan></text><text x="1286.0" y="482" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="1286.0" dy="0">• Checks returns often</tspan></text><text x="1286.0" y="503" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="1286.0" dy="0">• Can&#x27;t read XIRR / NAV / units</tspan></text><text x="1286.0" y="524" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="1286.0" dy="0">• Disengages quietly</tspan></text><text x="1286.0" y="555" font-size="11" font-weight="bold" fill="#6B7280" text-anchor="start"><tspan x="1286.0" dy="0">LEADING INDICATOR</tspan></text><text x="1286.0" y="574" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="1286.0" dy="0">Returns-related support</tspan><tspan x="1286.0" dy="16.900000000000002">contacts; explainer views</tspan></text><line x1="1286.0" y1="652" x2="1546.0" y2="652" stroke="#E5E7EB"/><text x="1286.0" y="668" font-size="13" font-weight="bold" fill="#111827" text-anchor="start"><tspan x="1286.0" dy="0">Stop posts: 2% all · 8% first-time</tspan></text><text x="1286.0" y="688" font-size="13" font-weight="normal" fill="#111827" text-anchor="start"><tspan x="1286.0" dy="0">Est. uplift: +0.1 pp all · +0.7 pp first-time</tspan></text><path d="M656.0 274 V256 H1252.0 V274" fill="none" stroke="#0072B2" stroke-width="3"/><rect x="676.0" y="240" width="556.0" height="30" fill="#FFFFFF"/><text x="954.0" y="261" font-size="15" font-weight="bold" fill="#0072B2" text-anchor="middle"><tspan x="954.0" dy="0">THE STOP MOMENT — research &amp; MVP focus: +3.3 pp all · +6.0 pp first-time</tspan></text><text x="492.0" y="261" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle"><tspan x="492.0" dy="0">LARGEST OVERALL — fix in parallel</tspan></text><rect x="40" y="752" width="1520" height="42" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/><text x="56" y="779" font-size="15" font-weight="bold" fill="#111827" text-anchor="start"><tspan x="56" dy="0">Recovery: a lapsed SIP counts as active again once one instalment succeeds within 30 days  ·  Leading indicator: Lapsed SIPs with a successful instalment within 30 days</tspan></text><text x="40" y="824" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="start"><tspan x="40" dy="0">Sizes from 110 posts about stopping (all) and 24 from first-time / young investors (small sample — a hypothesis to test). Assumes 40% of first SIPs lapse by month 12 and 30% of each branch</tspan><tspan x="40" dy="15.600000000000001">is recoverable. Solid blue = focus; dashed orange = parallel track.</tspan></text></svg>